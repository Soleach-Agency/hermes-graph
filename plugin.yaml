name: hermes-graph
version: "0.2.0"
description: Real-time 3D galaxy viewer for Hermes Agent activity and knowledge graphs
# Hermes 0.20.5 can load manifest v2, but its public-repository installer
# accepts up to v1. Keep the portable manifest at v1 until that installer gap
# is closed; the plugin runtime API remains independently pinned below.
manifest_version: 1
api_version: 1
tags: [observability, dashboard, graph, obsidian]
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - on_session_start
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - subagent_start
  - subagent_stop
  - kanban_task_claimed
  - kanban_task_completed
  - kanban_task_blocked
